<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="chartGradMaroon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E7D5C3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E7D5C3" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background (Deep Vintage Maroon) -->
  <rect width="800" height="500" fill="#24070C"/>
  
  <!-- Subtle Vintage Hairline Grid -->
  <g opacity="0.2" stroke="#5E1822" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="500"/>
    <line x1="760" y1="0" x2="760" y2="500"/>
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="460" x2="800" y2="460"/>
  </g>

  <!-- Editorial Plate Outer Mat -->
  <rect x="50" y="40" width="700" height="420" fill="#300B12" stroke="#541620" stroke-width="1.5"/>
  
  <!-- Plate Header Bar -->
  <rect x="50" y="40" width="700" height="42" fill="#22060A" stroke="#541620" stroke-width="1.5"/>
  <text x="75" y="66" font-family="'Space Mono', monospace, sans-serif" font-size="11" font-weight="700" fill="#E7D5C3" letter-spacing="1.5">✦ PLÅT I — EGET CASE: DIGITAL KAMPANJPLAN</text>
  <text x="725" y="66" text-anchor="end" font-family="'Space Mono', monospace, sans-serif" font-size="10" font-weight="700" fill="#9D8776" letter-spacing="1">PAID MEDIA &amp; ANALYS</text>

  <!-- Left: Google Search Card Mockup -->
  <g transform="translate(85, 110)">
    <rect x="0" y="0" width="375" height="155" fill="#22060A" stroke="#4C141C" stroke-width="1"/>
    
    <rect x="20" y="18" width="115" height="22" fill="#3D1018" stroke="#681F2B" stroke-width="1"/>
    <text x="77" y="33" text-anchor="middle" font-family="'Space Mono', monospace, sans-serif" font-size="9" font-weight="700" fill="#E7D5C3" letter-spacing="0.8">MÅLGRUPP &amp; BUDSKAP</text>
    
    <text x="20" y="68" font-family="'Fraunces', Georgia, serif" font-size="18" font-weight="700" fill="#F6ECE1">Kampanj med tydlig riktning</text>
    <text x="20" y="93" font-family="'Space Mono', monospace, sans-serif" font-size="11" fill="#E7D5C3" font-weight="600">MÅL: RÄCKVIDD · TRAFIK · ENGAGEMANG</text>
    <text x="20" y="118" font-family="-apple-system, sans-serif" font-size="11.5" fill="#CBB6A2">Kanalval, innehållsidéer och mätpunkter för en digital kampanj.</text>
    <text x="20" y="139" font-family="'Space Mono', monospace, sans-serif" font-size="10" font-weight="700" fill="#F6ECE1">✦ PLANERA · PUBLICERA · FÖLJ UPP</text>
  </g>

  <!-- Right: Key Stat Boxes -->
  <g transform="translate(485, 110)">
    <rect x="0" y="0" width="230" height="72" fill="#22060A" stroke="#4C141C" stroke-width="1"/>
    <text x="18" y="24" font-family="'Space Mono', monospace, sans-serif" font-size="10" font-weight="700" fill="#9D8776" letter-spacing="1">KANALER</text>
    <text x="18" y="55" font-family="'Fraunces', Georgia, serif" font-size="28" font-weight="800" fill="#E7D5C3">3 st</text>

    <rect x="0" y="83" width="230" height="72" fill="#22060A" stroke="#4C141C" stroke-width="1"/>
    <text x="18" y="107" font-family="'Space Mono', monospace, sans-serif" font-size="10" font-weight="700" fill="#9D8776" letter-spacing="1">MÄTPUNKTER</text>
    <text x="18" y="138" font-family="'Fraunces', Georgia, serif" font-size="28" font-weight="800" fill="#F6ECE1">KPI</text>
  </g>

  <!-- Lower Section: Trend Graph -->
  <g transform="translate(85, 290)">
    <rect x="0" y="0" width="630" height="145" fill="#22060A" stroke="#4C141C" stroke-width="1"/>
    <text x="22" y="28" font-family="'Space Mono', monospace, sans-serif" font-size="11" font-weight="700" fill="#E7D5C3" letter-spacing="1">UPPFÖLJNING: RÄCKVIDD, KLICK OCH ENGAGEMANG</text>
    
    <!-- Graph Grid Lines -->
    <line x1="22" y1="60" x2="605" y2="60" stroke="#3D1018" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="22" y1="95" x2="605" y2="95" stroke="#3D1018" stroke-width="1" stroke-dasharray="4 4"/>
    
    <!-- Graph Curve -->
    <path d="M 22 125 Q 140 110, 220 90 T 400 55 T 605 24 L 605 132 L 22 132 Z" fill="url(#chartGradMaroon)"/>
    <path d="M 22 125 Q 140 110, 220 90 T 400 55 T 605 24" fill="none" stroke="#E7D5C3" stroke-width="2.5"/>
    <circle cx="605" cy="24" r="5" fill="#E7D5C3"/>
  </g>
</svg>
