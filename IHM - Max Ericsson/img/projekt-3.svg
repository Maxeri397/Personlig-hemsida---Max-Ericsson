<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Canvas Background (Deep Vintage Maroon) -->
  <rect width="800" height="500" fill="#24070C"/>

  <!-- Subtle Vintage Hairline Grid -->
  <g opacity="0.2" stroke="#5E1822" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="500"/>
    <line x1="760" y1="0" x2="760" y2="500"/>
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="460" x2="800" y2="460"/>
  </g>

  <!-- Editorial Plate Outer Mat -->
  <rect x="50" y="40" width="700" height="420" fill="#300B12" stroke="#541620" stroke-width="1.5"/>
  
