<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Canvas Background (Deep Vintage Maroon) -->
  <rect width="800" height="500" fill="#24070C"/>

  <!-- Subtle Vintage Hairline Grid -->
  <g opacity="0.2" stroke="#5E1822" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="500"/>
    <line x1="760" y1="0" x2="760" y2="500"/>
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="460" x2="800" y2="460"/>
  </g>

  <!-- Editorial Plate Outer Mat -->
  <rect x="50" y="40" width="700" height="420" fill="#300B12" stroke="#541620" stroke-width="1.5"/>
  
  <!-- Plate Header Bar -->
  <rect x="50" y="40" width="700" height="42" fill="#22060A" stroke="#541620" stroke-width="1.5"/>
  <text x="75" y="66" font-family="'Space Mono', monospace, sans-serif" font-size="11" font-weight="700" fill="#E7D5C3" letter-spacing="1.5">✦ PLÅT II — DIGITAL NÄRVARO FÖR ETT BAND</text>
  <text x="725" y="66" text-anchor="end" font-family="'Space Mono', monospace, sans-serif" font-size="10" font-weight="700" fill="#9D8776" letter-spacing="1">SAMARBETE 2026</text>

  <!-- Section Subtitle inside graphic -->
  <g transform="translate(80, 112)">
    <text x="0" y="16" font-family="'Fraunces', Georgia, serif" font-size="20" font-weight="700" fill="#F6ECE1">WEBB, INNEHÅLL &amp; SYNGLIGHET</text>
    <text x="0" y="38" font-family="'Space Mono', monospace, sans-serif" font-size="11" fill="#CBB6A2">FORMATSTRUKTUR: HEMSIDA · SOCIALA MEDIER · LANSERING</text>
  </g>

  <!-- 3 Editorial Content Columns -->
  <g transform="translate(80, 175)">
    <!-- Column 1 -->
    <rect x="0" y="0" width="200" height="255" fill="#22060A" stroke="#4C141C" stroke-width="1"/>
    <rect x="18" y="18" width="95" height="22" fill="#3D1018" stroke="#681F2B" stroke-width="1"/>
    <text x="65" y="33" text-anchor="middle" font-family="'Space Mono', monospace, sans-serif" font-size="9" font-weight="700" fill="#F6ECE1">HEMSIDA</text>
    <text x="18" y="70" font-family="'Fraunces', Georgia, serif" font-size="16" font-weight="700" fill="#F6ECE1">Bandets uttryck</text>
    <text x="18" y="94" font-family="-apple-system, sans-serif" font-size="11.5" fill="#CBB6A2">En tydlig plats för musik, datum och bandets berättelse.</text>
    <rect x="18" y="138" width="164" height="85" fill="#1A0508" stroke="#3D1018" stroke-width="1"/>
    <text x="28" y="162" font-family="'Space Mono', monospace, sans-serif" font-size="10.5" fill="#F6ECE1">Fokus: Struktur &amp; design</text>
    <text x="28" y="184" font-family="'Space Mono', monospace, sans-serif" font-size="10.5" fill="#CBB6A2">CTA: Lyssna nu</text>
    <text x="28" y="206" font-family="'Space Mono', monospace, sans-serif" font-size="10.5" font-weight="700" fill="#E7D5C3">Mål: Tydlig närvaro</text>

    <!-- Column 2 (Highlighted with Beige accent) -->
    <g transform="translate(220, 0)">
      <rect x="0" y="0" width="200" height="255" fill="#22060A" stroke="#E7D5C3" stroke-width="1.5"/>
      <rect x="18" y="18" width="75" height="22" fill="#E7D5C3"/>
      <text x="55" y="33" text-anchor="middle" font-family="'Space Mono', monospace, sans-serif" font-size="9" font-weight="700" fill="#24070C">SOCIALT</text>
      <text x="18" y="70" font-family="'Fraunces', Georgia, serif" font-size="16" font-weight="700" fill="#F6ECE1">Innehållsidéer</text>
      <text x="18" y="94" font-family="-apple-system, sans-serif" font-size="11.5" fill="#CBB6A2">Inlägg som bygger intresse inför musik och spelningar.</text>
      <rect x="18" y="138" width="164" height="85" fill="#1A0508" stroke="#3D1018" stroke-width="1"/>
      <text x="28" y="162" font-family="'Space Mono', monospace, sans-serif" font-size="10.5" fill="#F6ECE1">Format: Video &amp; bild</text>
      <text x="28" y="184" font-family="'Space Mono', monospace, sans-serif" font-size="10.5" fill="#CBB6A2">Fokus: Bandets personlighet</text>
      <text x="28" y="206" font-family="'Space Mono', monospace, sans-serif" font-size="10.5" font-weight="700" fill="#E7D5C3">Mål: Engagemang</text>
    </g>

    <!-- Column 3 -->
    <g transform="translate(440, 0)">
      <rect x="0" y="0" width="200" height="255" fill="#22060A" stroke="#4C141C" stroke-width="1"/>
      <rect x="18" y="18" width="95" height="22" fill="#3D1018" stroke="#681F2B" stroke-width="1"/>
      <text x="65" y="33" text-anchor="middle" font-family="'Space Mono', monospace, sans-serif" font-size="9" font-weight="700" fill="#F6ECE1">LANSERING</text>
      <text x="18" y="70" font-family="'Fraunces', Georgia, serif" font-size="16" font-weight="700" fill="#F6ECE1">Nå ut till fler</text>
      <text x="18" y="94" font-family="-apple-system, sans-serif" font-size="11.5" fill="#CBB6A2">Samlad plan för att driva trafik till bandets digitala kanaler.</text>
      <rect x="18" y="138" width="164" height="85" fill="#1A0508" stroke="#3D1018" stroke-width="1"/>
      <text x="28" y="162" font-family="'Space Mono', monospace, sans-serif" font-size="10.5" fill="#F6ECE1">Mätning: Klick &amp; räckvidd</text>
      <text x="28" y="184" font-family="'Space Mono', monospace, sans-serif" font-size="10.5" fill="#CBB6A2">Länk: Bandets hemsida</text>
      <text x="28" y="206" font-family="'Space Mono', monospace, sans-serif" font-size="10.5" font-weight="700" fill="#E7D5C3">Mål: Nya lyssnare</text>
    </g>
  </g>
</svg>
